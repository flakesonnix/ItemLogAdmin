name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = relaxed

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (tests + jar)
        run: nix develop --accept-flake-config --command bash -c 'gradle test --no-daemon && gradle shadowJar --no-daemon'

      - name: Nix build (impure)
        run: nix build --accept-flake-config --option sandbox relaxed --impure --no-link --print-out-paths
        continue-on-error: true

      - name: Collect jars
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/ 2>/dev/null || true
          cp -r build/libs dist/libs 2>/dev/null || true
          ls -lh dist/ dist/libs 2>&1 | head -n 100

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }} — ${{ github.repository }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            dist/**/*.jar
          fail_on_unmatched_files: false
